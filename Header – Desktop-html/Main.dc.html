<div style="display: flex; align-items: center; gap: 24px">

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F4BFF"},"ink":{"editor":"color","default":"#0F1115"},"$preview":{"width":1440,"height":440}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#2F4BFF',
ink: this.props.ink ?? '#0F1115'
};
}
}
</script>
