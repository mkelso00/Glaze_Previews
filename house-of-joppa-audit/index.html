<style>
  :root{
    --brand-primary:#1F3D7A; --brand-accent:#9A6C34;
    --brand-ink:#131A2B; --brand-ground:#F5F6F8;
    --g-ground:var(--brand-ground); --g-surface:#FFFFFF; --g-line:#D6DAE3;
    --g-ink:var(--brand-ink); --g-ink-2:#3D465C; --g-ink-3:#6B7488;
    --g-crit:#9C2B31; --g-crit-soft:#F7E7E7;
    --g-shadow:0 1px 2px rgba(19,26,43,.05),0 18px 44px -20px rgba(19,26,43,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --g-ground:#0E1320; --g-surface:#161D2E; --g-line:#2C3547;
      --g-ink:#E9ECF3; --g-ink-2:#B4BCCD; --g-ink-3:#8891A5;
      --g-crit:#E88B8F; --g-crit-soft:#2E1A1B;
      --g-shadow:0 1px 2px rgba(0,0,0,.4),0 18px 44px -20px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --g-ground:#0E1320; --g-surface:#161D2E; --g-line:#2C3547;
    --g-ink:#E9ECF3; --g-ink-2:#B4BCCD; --g-ink-3:#8891A5;
    --g-crit:#E88B8F; --g-crit-soft:#2E1A1B;
    --g-shadow:0 1px 2px rgba(0,0,0,.4),0 18px 44px -20px rgba(0,0,0,.7);
  }
  *,*::before,*::after{box-sizing:border-box}
  img{max-width:100%;height:auto}
  table{border-collapse:collapse}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--g-ground); color:var(--g-ink);
    font-family:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #gate{
    min-height:100vh; min-height:100dvh; display:flex; align-items:center;
    justify-content:center; padding:28px 20px;
  }
  .panel{
    width:100%; max-width:404px; background:var(--g-surface);
    border:1px solid var(--g-line); border-radius:12px;
    padding:38px 34px 32px; box-shadow:var(--g-shadow);
    display:flex; flex-direction:column; gap:22px;
  }
  .lock{display:flex;align-items:center;gap:13px}
  .lock .mark{
    width:34px;height:34px;border-radius:8px;background:var(--brand-primary);color:#FFFFFF;
    display:flex;align-items:center;justify-content:center;
    font-family:"EB Garamond",Georgia,serif;font-size:1.32rem;font-weight:600;
    line-height:1;padding-bottom:2px;flex-shrink:0;
  }
  .lock .word{
    font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    font-size:.935rem;color:var(--g-ink);
  }
  .lock .word span{font-weight:300;letter-spacing:.16em;color:var(--g-ink-3)}
  .panel h1{
    font-family:"EB Garamond",Georgia,"Times New Roman",serif;
    font-weight:500;font-size:1.6rem;line-height:1.2;margin:0;letter-spacing:-.005em;
  }
  .panel .sub{font-size:.92rem;color:var(--g-ink-2);margin:0;line-height:1.55}
  form{display:flex;flex-direction:column;gap:12px}
  label{
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.66rem;
    letter-spacing:.12em;text-transform:uppercase;color:var(--g-ink-3);
  }
  input[type=password]{
    width:100%;padding:12px 14px;font:inherit;font-size:1rem;
    color:var(--g-ink);background:var(--g-ground);
    border:1px solid var(--g-line);border-radius:8px;
  }
  input[type=password]:focus{outline:2px solid var(--brand-accent);outline-offset:1px}
  button{
    padding:12px 16px;font:inherit;font-size:.97rem;font-weight:600;
    color:#FFFFFF;background:var(--brand-primary);
    border:0;border-radius:8px;cursor:pointer;
  }
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.6;cursor:progress}
  button:focus-visible,input:focus-visible{outline:2px solid var(--brand-accent);outline-offset:2px}
  .msg{
    font-size:.87rem;line-height:1.5;padding:11px 13px;border-radius:8px;
    background:var(--g-crit-soft);color:var(--g-crit);border:1px solid var(--g-crit);
  }
  .msg[hidden]{display:none}
  .foot{font-size:.79rem;color:var(--g-ink-3);line-height:1.5;margin:0}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="gate">
  <div class="panel">
    <div class="lock">
      <span class="mark" aria-hidden="true">G</span>
      <span class="word">Glaze <span>Digital</span></span>
    </div>
    <div>
      <h1>House of Joppa audit</h1>
      <p class="sub">CRO, UX, SEO and retention review, August 2026. This report is confidential and contains live store figures.</p>
    </div>
    <form id="f" autocomplete="off">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="off">
      <button id="go" type="submit">Unlock report</button>
    </form>
    <p class="msg" id="msg" role="alert" hidden></p>
    <p class="foot">Prepared by Glaze Digital. If you need the password, ask your Glaze contact.</p>
  </div>
</div>

  var form=document.getElementById("f"),
      pw=document.getElementById("pw"),
      btn=document.getElementById("go"),
      msg=document.getElementById("msg"),
      gate=document.getElementById("gate");

  function say(t){msg.textContent=t;msg.hidden=false;}
  function b2a(b64){
    var s=atob(b64),u=new Uint8Array(s.length);
    for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);
    return u;
  }

  if(!(window.crypto&&window.crypto.subtle)){
    say("This page needs a secure connection to unlock. Open it over https rather than as a local file, then try again.");
    btn.disabled=true;pw.disabled=true;return;
  }

  form.addEventListener("submit",function(e){
    e.preventDefault();
    msg.hidden=true;
    var phrase=(pw.value||"").trim().toLowerCase();
    if(!phrase){say("Enter the password to continue.");return;}
    btn.disabled=true;btn.textContent="Unlocking";

    var enc=new TextEncoder();
    crypto.subtle.importKey("raw",enc.encode(phrase),{name:"PBKDF2"},false,["deriveKey"])
    .then(function(base){
      return crypto.subtle.deriveKey(

    .then(function(key){
      return crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(B.IV)},key,b2a(B.CT));
    })

      gate.remove();
      document.body.innerHTML=html;
      /* styles arriving via innerHTML apply, but re-stamping them is safer across browsers */
      var styles=document.body.querySelectorAll("style");
      for(var i=0;i<styles.length;i++){

        document.head.appendChild(s);
        styles[i].remove();

      window.scrollTo(0,0);
      document.title=document.title.replace(/^Protected . /,"");

      btn.disabled=false;btn.textContent="Unlock report";
      say("That password is not right. Check with Glaze if you need it again.");
      pw.value="";pw.focus();
