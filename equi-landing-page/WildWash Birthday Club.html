  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

argin: 0; background: #F7F3EA; -webkit-font-smoothing: antialiased; }\n  a { color: #2E6B4A; }\n  a:hover { color: #143D2B; }\n  * { box-sizing: border-box; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family: 'Hanken Grotesk', system-ui, sans-serif; color: #143D2B; background: #F7F3EA;\">\n\n  <div style=\"background: #E7E2D6; color: #6B7A70; text-align: center; padding: 34px 20px; font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; border-bottom: 1px dashed rgba(20,61,43,0.25);\">Header<\u002Fdiv>\n\n  <section style=\"position: relative; background: #143D2B; min-height: clamp(520px, 68vh, 720px); display: flex; align-items: flex-end; overflow: hidden;\">\n    <div style=\"position: absolute; inset: 0;\">\n      <image-slot id=\"ww-hero\" shape=\"rect\" placeholder=\"Hero image — horse with birthday hat, or collab lifestyle shot\" src=\"28d0bbf3-2129-426c-be22-cd69cd7f910f\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <div style=\"position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(11,38,26,0.94) 0%, rgba(11,38,26,0.78) 38%, rgba(11,38,26,0.28) 72%, rgba(11,38,26,0.15) 100%);\"><\u002Fdiv>\n\n    <div style=\"position: relative; width: 100%; max-width: 1080px; margin: 0 auto; padding: clamp(40px, 7vw, 84px) 24px clamp(36px, 5vw, 60px); color: #F7F3EA;\">\n      <p style=\"margin: 0 0 16px; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700; color: #E4B65C;\">Horse Birthday Club · Members only<\u002Fp>\n      <h1 style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(40px, 7vw, 78px); line-height: 1.02; margin: 0 0 20px; max-width: 17ch; text-wrap: pretty; color: #FFFFFF;\">It's their birthday. Spoil them properly.<\u002Fh1>\n      <p style=\"margin: 0 0 32px; max-width: 50ch; font-size: clamp(18px, 2vw, 21px); line-height: 1.55; color: #EAF0EA;\">Carrots are lovely. A gut that behaves, joints that move and a coat that gleams is a better present. Birthday Club members get {{ discountLabel }} off the whole Equinutritive range.<\u002Fp>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: center;\">\n        <a href=\"#unlock\" style=\"display: inline-flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; padding: 17px 34px; border-radius: 999px; background: #C08A2E; color: #FFFFFF; text-decoration: none;\" style-hover=\"background: #A9761F; color: #FFFFFF;\">Unlock the offer<span style=\"font-size: 18px; line-height: 1;\">→<\u002Fspan><\u002Fa>\n        <span style=\"font-size: 15px; font-weight: 600; color: #C8D8CB;\">Password's in your WildWash email<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1080px; margin: 0 auto; padding: 22px 24px;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;\">\n      <div style=\"background: #FFFFFF; border: 1px solid rgba(20,61,43,0.12); border-radius: 14px; padding: 16px 18px; font-size: 15px; font-weight: 600; line-height: 1.4;\">100% money-back guarantee<\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid rgba(20,61,43,0.12); border-radius: 14px; padding: 16px 18px; font-size: 15px; font-weight: 600; line-height: 1.4;\">Free UK &amp; Ireland shipping<\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid rgba(20,61,43,0.12); border-radius: 14px; padding: 16px 18px; font-size: 15px; font-weight: 600; line-height: 1.4;\">100% natural, no fillers<\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid rgba(20,61,43,0.12); border-radius: 14px; padding: 16px 18px; font-size: 15px; font-weight: 600; line-height: 1.4;\">50,000+ happy customers<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"unlock\" style=\"max-width: 1080px; margin: 0 auto; padding: 50px 24px 60px;\">\n    <div style=\"background: #143D2B; color: #F7F3EA; border-radius: 24px; padding: clamp(32px, 5vw, 56px); display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px; align-items: center;\">\n      <div>\n        <h2 style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.1; margin: 0 0 14px;\">Members' door. Password, please.<\u002Fh2>\n        <p style=\"margin: 0 0 18px; font-size: 17px; line-height: 1.6; color: #D9E5DC;\">This offer is just for the WildWash Horse Birthday Club, so it lives behind a password rather than a code that wanders off round the internet.<\u002Fp>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: #D9E5DC;\">Enter it once and your {{ discountLabel }} follows you through to checkout. Nothing to type, nothing to forget.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; color: #143D2B; border-radius: 18px; padding: 26px;\">\n        <label for=\"ww-pw\" style=\"display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px;\">Password<\u002Flabel>\n        <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n          <input id=\"ww-pw\" type=\"text\" value=\"{{ entry }}\" sc-camel-on-change=\"{{ onEntry }}\" sc-camel-on-key-down=\"{{ onKey }}\" placeholder=\"From your WildWash email\" style=\"flex: 1 1 140px; min-width: 0; font-family: inherit; font-size: 16px; padding: 14px; border: 1px solid rgba(20,61,43,0.25); border-radius: 10px; background: #F7F3EA; color: #143D2B;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ onUnlock }}\" style=\"flex: 0 0 auto; font-family: inherit; font-size: 15px; font-weight: 700; padding: 14px 24px; border: none; border-radius: 10px; background: #143D2B; color: #F7F3EA; cursor: pointer;\" style-hover=\"background: #2E6B4A;\">Unlock<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin: 14px 0 0; font-size: 15px; line-height: 1.5; min-height: 22px; color: {{ noteColor }};\">{{ note }}<\u002Fp>\n        <sc-if value=\"{{ unlocked }}\" hint-placeholder-val=\"{{ false }}\">\n          <a href=\"https://equinutritive.com/collections/all\" style=\"display: block; text-align: center; margin-top: 16px; font-size: 16px; font-weight: 700; padding: 15px; border-radius: 999px; background: #C08A2E; color: #FFFFFF; text-decoration: none;\" style-hover=\"background: #A9761F; color: #FFFFFF;\">Shop the range<\u002Fa>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background: #FFFFFF; border-top: 1px solid rgba(20,61,43,0.1); border-bottom: 1px solid rgba(20,61,43,0.1);\">\n    <div style=\"max-width: 1080px; margin: 0 auto; padding: clamp(48px, 6vw, 80px) 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 48px; align-items: center;\">\n      <div>\n        <p style=\"margin: 0 0 14px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: #C08A2E;\">The collaboration<\u002Fp>\n        <h2 style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.12; margin: 0 0 18px;\">Outside in, inside out<\u002Fh2>\n        <p style=\"margin: 0 0 14px; font-size: 17px; line-height: 1.65; color: #3C5C4B;\">WildWash look after horses from the outside in — natural grooming that's kind to skin and smells rather good on a yard. We look after them from the inside out, with 100% natural supplements built around gut health.<\u002Fp>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #3C5C4B;\">Same principles, different end of the horse. No molasses, no soy, no grains, no fillers, no shellfish — and a 100% money-back guarantee, because we'd rather you told us than gave up.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px;\">\n        <div style=\"height: 200px; min-width: 0;\"><image-slot id=\"ww-collab-1\" shape=\"rounded\" radius=\"16\" placeholder=\"WildWash product\" src=\"5936e2b2-10ea-42cf-9be8-e7231141cd2d\"><\u002Fimage-slot><\u002Fdiv>\n        <div style=\"height: 200px; min-width: 0;\"><image-slot id=\"ww-collab-2\" shape=\"rounded\" radius=\"16\" placeholder=\"Equinutritive product\" src=\"a049e371-748c-44b9-96d7-926b2e093fe9\"><\u002Fimage-slot><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1080px; margin: 0 auto; padding: clamp(48px, 6vw, 80px) 24px;\">\n    <h2 style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.12; margin: 0 0 8px; text-align: center;\">How the discount works<\u002Fh2>\n    <p style=\"margin: 0 auto 40px; max-width: 44ch; text-align: center; font-size: 17px; line-height: 1.6; color: #3C5C4B;\">Three steps, and one of them is shopping.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px;\">\n      <div style=\"background: #FFFFFF; border: 1px solid rgba(20,61,43,0.12); border-radius: 18px; padding: 26px;\">\n        <span style=\"font-family: 'Newsreader', serif; font-size: 30px; color: #C08A2E; display: block; line-height: 1; margin-bottom: 12px;\">01<\u002Fspan>\n        <h3 style=\"font-size: 19px; font-weight: 700; margin: 0 0 8px;\">Enter the password<\u002Fh3>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3C5C4B;\">The one from your Birthday Club email. It only works on this page.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid rgba(20,61,43,0.12); border-radius: 18px; padding: 26px;\">\n        <span style=\"font-family: 'Newsreader', serif; font-size: 30px; color: #C08A2E; display: block; line-height: 1; margin-bottom: 12px;\">02<\u002Fspan>\n        <h3 style=\"font-size: 19px; font-weight: 700; margin: 0 0 8px;\">Shop the range<\u002Fh3>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3C5C4B;\">One product per need, so there's very little to work out. The quiz takes two minutes if you'd rather be pointed.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid rgba(20,61,43,0.12); border-radius: 18px; padding: 26px;\">\n        <span style=\"font-family: 'Newsreader', serif; font-size: 30px; color: #C08A2E; display: block; line-height: 1; margin-bottom: 12px;\">03<\u002Fspan>\n        <h3 style=\"font-size: 19px; font-weight: 700; margin: 0 0 8px;\">{{ discountLabel }} comes off at checkout<\u002Fh3>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3C5C4B;\">Applied automatically. No code to copy, paste or lose.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background: #143D2B; color: #F7F3EA;\">\n    <div style=\"max-width: 1080px; margin: 0 auto; padding: clamp(48px, 6vw, 80px) 24px;\">\n      <h2 style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(28px, 3.6vw, 40px); margin: 0 0 8px; text-align: center;\">Real people, real results<\u002Fh2>\n      <p style=\"margin: 0 auto 40px; max-width: 46ch; text-align: center; font-size: 17px; line-height: 1.6; color: #D9E5DC;\">A snippet of what lands in our inbox most weeks.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px;\">\n        <sc-for list=\"{{ reviews }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <figure style=\"margin: 0; background: rgba(247,243,234,0.06); border: 1px solid rgba(247,243,234,0.16); border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 14px;\">\n            <span style=\"color: #E4B65C; font-size: 16px; letter-spacing: 0.16em;\">{{ r.stars }}<\u002Fspan>\n            <blockquote style=\"margin: 0; font-family: 'Newsreader', serif; font-size: 20px; line-height: 1.45;\">{{ r.quote }}<\u002Fblockquote>\n            <figcaption style=\"font-size: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #B9CDBF;\">{{ r.name }}<\u002Ffigcaption>\n          <\u002Ffigure>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1080px; margin: 0 auto; padding: clamp(48px, 6vw, 80px) 24px;\">\n    <div style=\"background: #FFFFFF; border: 1px solid rgba(20,61,43,0.14); border-radius: 24px; padding: clamp(32px, 5vw, 56px); display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px; align-items: center;\">\n      <div>\n        <h2 style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(26px, 3.2vw, 36px); line-height: 1.14; margin: 0 0 14px;\">Hear about the next one first<\u002Fh2>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #3C5C4B;\">Join our mailing list for future offers, seasonal advice and the odd bit of nutrition nerdery. Unsubscribe whenever you like.<\u002Fp>\n      <\u002Fdiv>\n      <form sc-camel-on-submit=\"{{ onSignup }}\">\n        <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n          <input type=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"you@example.com\" style=\"flex: 1 1 180px; min-width: 0; font-family: inherit; font-size: 16px; padding: 14px; border: 1px solid rgba(20,61,43,0.25); border-radius: 10px; background: #F7F3EA; color: #143D2B;\">\n          <button type=\"submit\" style=\"flex: 0 0 auto; font-family: inherit; font-size: 15px; font-weight: 700; padding: 14px 24px; border: none; border-radius: 10px; background: #143D2B; color: #F7F3EA; cursor: pointer;\" style-hover=\"background: #2E6B4A;\">Sign me up<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin: 12px 0 0; font-size: 15px; line-height: 1.5; min-height: 22px; color: #2E6B4A;\">{{ signupNote }}<\u002Fp>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"background: #E7E2D6; color: #6B7A70; text-align: center; padding: 46px 20px; font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; border-top: 1px dashed rgba(20,61,43,0.25);\">Footer<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;discountPercent&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:15,&quot;min&quot;:5,&quot;max&quot;:50,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Offer&quot;},&quot;password&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;wildwash&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Offer&quot;}}\">\nclass Component extends DCLogic {\n  state = { entry: \"\", unlocked: false, error: false, email: \"\", signupNote: \"\" };\n\n  get pw() { return (this.props.password ?? \"wildwash\").trim().toLowerCase(); }\n\n  componentDidMount() {\n    try {\n      if (localStorage.getItem(\"ww-birthday-unlocked\") === \"1\") this.setState({ unlocked: true });\n    } catch (e) {}\n  }\n\n  unlock = () => {\n    const ok = this.state.entry.trim().toLowerCase() === this.pw;\n    this.setState({ unlocked: ok, error: !ok });\n    if (ok) { try { localStorage.setItem(\"ww-birthday-unlocked\", \"1\"); } catch (e) {} }\n  };\n\n  renderVals() {\n    const pct = this.props.discountPercent ?? 15;\n    const { unlocked, error } = this.state;\n    return {\n      discountLabel: pct + \"%\",\n      entry: this.state.entry,\n      unlocked,\n      note: unlocked\n        ? \"You're in. Your \" + pct + \"% is live for this visit — shop away.\"\n        : error\n          ? \"That's not the one. Check your Birthday Club email.\"\n          : \"Case doesn't matter.\",\n      noteColor: unlocked ? \"#2E6B4A\" : error ? \"#B4441F\" : \"#5F7A6B\",\n      onEntry: (e) => this.setState({ entry: e.target.value, error: false }),\n      onKey: (e) => { if (e.key === \"Enter\") this.unlock(); },\n      onUnlock: this.unlock,\n      email: this.state.email,\n      signupNote: this.state.signupNote,\n      onEmail: (e) => this.setState({ email: e.target.value }),\n      onSignup: (e) => {\n        e.preventDefault();\n        this.setState({ signupNote: this.state.email ? \"Thanks — you're on the list.\" : \"\" });\n      },\n      reviews: [\n        { stars: \"★★★★★\", quote: \"Three weeks in and her coat looks like someone else's horse.\", name: \"Hannah, Co. Down\" },\n        { stars: \"★★★★★\", quote: \"He's calm enough to hack out alone again. I'd given up on that.\", name: \"Sophie, Cheshire\" },\n        { stars: \"★★★★★\", quote: \"Simple to feed, he eats it without sulking, and the difference is obvious.\", name: \"Rachel, Perthshire\" }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
